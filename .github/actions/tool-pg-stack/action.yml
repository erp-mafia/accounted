name: Postgres and PostgREST with every migration
description: >-
  Waits for the Postgres that start-postgres began on localhost:5432, replays
  the bootstrap and every migration, then starts PostgREST on the host
  network. The job runs start-postgres first, declares the DATABASE_URL,
  TOOL_PG_REST_URL and PGPASSWORD variables, and ends with steps that remove
  the postgrest and ci-postgres containers (if: always()): a composite action
  has no step that runs after the job's own steps.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/wait-for-postgres
    - name: Bootstrap
      # Same replay as pg-real, and no bulk GRANT after it: the database then
      # carries the grants production has, so a tool that needs a grant
      # production lacks fails here with 42501.
      shell: bash
      run: |
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
    - name: Apply every migration
      # One connection for all of them, the session reset between files
      # (scripts/ci/replay-migrations.sh).
      shell: bash
      run: scripts/ci/replay-migrations.sh supabase/migrations/*.sql
    - name: Start PostgREST
      # On the host network rather than as a service: the job runs on the
      # runner host and reaches Postgres through its mapped port, and
      # PostgREST reaches it the same way. Started after the migrations, so
      # its schema cache already holds them.
      shell: bash
      run: |
        # A container left by a job that did not reach its "Stop PostgREST"
        # step would hold the name and the port.
        docker rm -f postgrest >/dev/null 2>&1 || true
        docker run -d --name postgrest --network host \
          -e PGRST_DB_URI="postgres://postgres:postgres@127.0.0.1:5432/postgres" \
          -e PGRST_DB_SCHEMAS=public \
          -e PGRST_DB_ANON_ROLE=anon \
          -e PGRST_JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long" \
          -e PGRST_DB_MAX_ROWS=100000 \
          -e PGRST_SERVER_PORT=3000 \
          postgrest/postgrest:v12.2.3@sha256:729bf65c733b73f5b52777f0e4b853f22ed73aa67a22d38269d289779b0a8401
        for _ in $(seq 1 60); do
          curl -sf -o /dev/null "$TOOL_PG_REST_URL/" && break
          sleep 1
        done
        curl -sf -o /dev/null "$TOOL_PG_REST_URL/" || { docker logs postgrest; exit 1; }
