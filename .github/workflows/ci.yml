name: CI

# The merge gates: checks, pr-privacy,
# build, unit-tests (four shards), pg-coverage-gate, pg-real, pg-upgrade and
# tool-pg. Production migrations are in migrations-production.yml; the nightly
# simulated company and the report benchmark are in nightly.yml.
#
# Two aggregate jobs, Core Build and pg-real gate, are the check names branch
# protection requires. Each runs with if: always() and fails unless every job
# it covers succeeded: a job that is skipped because a job it needs failed
# does not fail its dependents, and a skipped required check counts as passed.
#
# Pull requests run everything. Pushes to main and merge groups run everything
# except the jobs that read a pull request (pr-privacy, pg-coverage-gate,
# pg-upgrade). Pushes to main are the only runs that write caches: GitHub
# scopes a cache entry to the ref that wrote it, and entries written on main
# are readable from every pull request.
#
# Runners: every job runs on a GitHub-hosted runner unless a repository
# variable names another one. TYPECHECK_RUNNER is the label of a runner that
# takes one job at a time on a host with 16 GB. The two jobs that need most of
# that memory run there, so they never run at the same moment: the type check
# and the build (8.5 GB). CI_RUNNER is the label for every other job. The pg
# jobs map Postgres and PostgREST to fixed host ports, so a host that carries
# CI_RUNNER must run one of those jobs at a time.
#
# No job here reads a secret, except pr-privacy, which reads the customer name
# list when the repository has one.

on:
  pull_request:
  push:
    branches: [main]
  # A merge queue, when the repository uses one, tests the queued commit here
  # before it lands on main.
  merge_group:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. On main one
# run is in progress at a time and it always finishes; of the pushes that
# arrive meanwhile only the newest waits, and GitHub cancels the waiting runs
# it replaces. The newest commit holds every earlier merge, so main is still
# tested after a burst of merges, once, not once per merge. The price: a red
# main after a burst names the burst, not the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Checks
    runs-on: ${{ vars.TYPECHECK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # tsc's incremental state and ESLint's result cache (see the two cache
      # steps below and scripts/checks/no-new-type-errors.mjs).
      CHECKS_CACHE_DIR: .ci-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-core
        with:
          save-cache: 'true'

      # Main's latest state for this lockfile. A warm tsc rechecks only what
      # changed and still reports every stored error. The lockfile is in the
      # key, so a TypeScript or ESLint upgrade starts clean. Cache keys are
      # immutable, hence the commit in the key and the prefix fallback.
      - name: Restore tsc and ESLint state
        id: checks-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: checks-state-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            checks-state-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Skill bodies in sync with the seed migration
        run: npm run skills:check

      - name: Taxonomy registry in sync
        run: npm run taxonomy:check

      - name: accounted-api agent skill in sync
        run: npm run apiskill:check

      - name: NOTICE in sync
        run: npm run notice:check

      - name: Lint
        # Keyed on content, not mtime: a checkout rewrites every mtime. On
        # several threads: a run without the cache reads every file.
        run: |
          mkdir -p "$CHECKS_CACHE_DIR"
          npm run check:lint -- --concurrency auto --cache --cache-location "$CHECKS_CACHE_DIR/eslint" --cache-strategy content

      - name: Generate route types
        # The route types next build generates (.next/types, validator.ts).
        # With them this type check covers a superset of the build's own, so
        # the build job skips that pass (SKIP_BUILD_TYPECHECK).
        run: npx next typegen

      - name: Type check
        id: types
        # TypeScript 7, the native compiler (scripts/checks/no-new-type-errors.mjs
        # says how it is installed and how its memory is bounded). The step
        # prints the time and the memory the check took.
        run: npm run check:types

      - name: Antipattern ratchet
        run: npm run check:guards

      - name: Validate konteringspaket catalogue
        run: npm run validate:packs

      - name: Validate community registry
        run: npm run validate:registry

      - name: No core imports from extensions
        run: |
          VIOLATIONS=$(grep -r "from '@/extensions/" src/lib/ src/app/api/ src/components/ --include="*.ts" --include="*.tsx" \
            | grep -v "app/api/extensions/" \
            | grep -v "components/extensions/" \
            | grep -v "lib/extensions/_generated/" \
            | grep -v "lib/extensions/loader.ts" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Core code imports from @/extensions/:"
            echo "$VIOLATIONS"
            exit 1
          fi

      # Main writes the state every pull request reads. Saved even when a later check failed, as long as
      # the type check ran.
      - name: Save tsc and ESLint state
        if: ${{ !cancelled() && github.event_name == 'push' && steps.types.outcome != 'skipped' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache
          key: ${{ steps.checks-state.outputs.cache-primary-key }}

  # Customer data in the pull request title, description or a commit message
  # (scripts/check-mr-privacy.mjs lists the rules). Editing the title or the
  # description starts no run, so an edit is scanned on the next push or
  # rerun. Customer names come from the MR_PRIVACY_CUSTOMER_NAMES_B64 secret;
  # without it, and on pull requests from forks, the job says so and runs the
  # other rules.
  pr-privacy:
    name: PR privacy
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so every commit since the base is present, and the
          # pull request's own head rather than the merge commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: No customer data in the title, description or commit messages
        # Node built-ins only: no npm ci.
        env:
          MR_TITLE: ${{ github.event.pull_request.title }}
          MR_DESCRIPTION: ${{ github.event.pull_request.body }}
          MR_PRIVACY_BASE: ${{ github.event.pull_request.base.sha }}
          MR_PRIVACY_CUSTOMER_NAMES_B64: ${{ secrets.MR_PRIVACY_CUSTOMER_NAMES_B64 }}
        run: node scripts/check-mr-privacy.mjs

  build:
    name: Build (zero extensions)
    # On the type check's runner, which takes one job at a time: side by side
    # on one 16 GB host the two run it out of memory.
    runs-on: ${{ vars.TYPECHECK_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    env:
      # The Next.js build worker runs out of memory on Node's default heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # The checks job's type check covers this build's (see there). Vercel
      # builds leave it unset and still type-check.
      SKIP_BUILD_TYPECHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-core
      - run: npm run build
      # The support assistant reads its page texts off disk at run time
      # (src/lib/agent/support/page-texts.ts). The build writes them (prebuild
      # in package.json) and next.config.ts names them for the function that
      # reads them. Both halves are checked here, so a build that would ship
      # the assistant without them fails instead of answering from the menu
      # alone in production.
      - name: Support page texts are built and traced
        run: |
          test -s src/lib/agent/support/_generated/page-texts.json
          test -s .next/standalone/src/lib/agent/support/_generated/page-texts.json
      # The JavaScript each of the most visited pages ships on a hard load,
      # held to scripts/perf/page-budgets.json: a page over its budget fails
      # the job with the numbers.
      - name: Page JavaScript budgets
        run: node scripts/perf/page-js.mjs --check

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      # One failing shard does not hide the other three's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-core
      - name: Unit tests
        env:
          SHARD: ${{ matrix.shard }}
        run: npm test -- --shard="$SHARD/4"

  # A migration that touches a trigger, RPC, RLS policy or DEFERRABLE
  # constraint must come with a *.pg.test.ts (scripts/check-pg-test-coverage.mjs).
  pg-coverage-gate:
    name: pg coverage gate
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the pull request's base commit is present.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          package-manager-cache: false
      - name: Require pg-real coverage for trigger, RPC and RLS migrations
        # Node built-ins only: no npm ci.
        env:
          PG_GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-pg-test-coverage.mjs

  # Every migration replayed on an empty database, then the pg-real suite.
  pg-real:
    name: pg-real
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
      # The suite runs on this many workers, each in its own copy of the
      # migrated database (tests/pg/parallel.ts).
      PG_REAL_WORKERS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Postgres downloads and starts while the toolchain installs.
      - uses: ./.github/actions/start-postgres
      - uses: ./.github/actions/setup-core
        with:
          zero-extensions: 'false'
      - uses: ./.github/actions/wait-for-postgres
      - name: Bootstrap
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
      - name: Apply every migration
        # On a session whose search_path is the bare default, without the
        # extensions schema: the session a fresh `supabase db push` gets. A
        # migration that names an extension's type or function without its
        # schema (vector, not extensions.vector) fails here, as it would there.
        # One session for all of them, a fresh session per file
        # (scripts/ci/replay-migrations.sh).
        env:
          PGOPTIONS: -c search_path="$user",public
        run: scripts/ci/replay-migrations.sh supabase/migrations/*.sql
      - run: npm run test:pg
      - name: Stop Postgres
        # Started by hand (start-postgres), so nothing else removes it. When an
        # earlier step failed, its log goes to the job log first.
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then docker logs --tail 200 ci-postgres 2>&1 || true; fi
          docker rm -f -v ci-postgres >/dev/null 2>&1 || true

  # Schema at the merge base, real rows seeded, then ONLY the new migrations on
  # top: proves existing data survives them. A pull request that adds no
  # migration exits after the diff.
  pg-upgrade:
    name: pg-upgrade
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so the merge base is present.
          fetch-depth: 0
          persist-credentials: false
      - name: New migrations
        id: new
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          echo "Merge base: $BASE"
          git ls-tree -r --name-only HEAD -- supabase/migrations | grep '\.sql$' | sort > "$RUNNER_TEMP/head-migrations.txt"
          git ls-tree -r --name-only "$BASE" -- supabase/migrations | grep '\.sql$' | sort > "$RUNNER_TEMP/base-migrations.txt"
          comm -23 "$RUNNER_TEMP/head-migrations.txt" "$RUNNER_TEMP/base-migrations.txt" > "$RUNNER_TEMP/new-migrations.txt"
          COUNT=$(wc -l < "$RUNNER_TEMP/new-migrations.txt" | tr -d ' ')
          echo "New migrations ($COUNT):"
          cat "$RUNNER_TEMP/new-migrations.txt"
          if [ "$COUNT" = "0" ]; then echo "This pull request adds no migration; nothing to upgrade-test."; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      # Only a pull request that adds a migration starts a database.
      - if: steps.new.outputs.count != '0'
        uses: ./.github/actions/start-postgres
      - name: Base migrations from the merge base
        if: steps.new.outputs.count != '0'
        # Read from the merge-base tree, not the working tree, so an edit to
        # a shipped migration cannot hide itself here. Written out while
        # Postgres starts.
        env:
          BASE: ${{ steps.new.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/base"
          while read -r f; do
            git show "$BASE:$f" > "$RUNNER_TEMP/base/$(basename "$f")"
          done < "$RUNNER_TEMP/base-migrations.txt"
      - if: steps.new.outputs.count != '0'
        uses: ./.github/actions/wait-for-postgres
      - name: Upgrade test
        if: steps.new.outputs.count != '0'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
          mapfile -t base < <(sed "s|^supabase/migrations/|$RUNNER_TEMP/base/|" "$RUNNER_TEMP/base-migrations.txt")
          scripts/ci/replay-migrations.sh "${base[@]}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/upgrade/seed.sql
          mapfile -t new < "$RUNNER_TEMP/new-migrations.txt"
          scripts/ci/replay-migrations.sh "${new[@]}"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pg/upgrade/assert.sql
      - name: Stop Postgres
        # Started by hand (start-postgres), so nothing else removes it. When an
        # earlier step failed, its log goes to the job log first.
        if: ${{ always() && steps.new.outputs.count != '0' }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then docker logs --tail 200 ci-postgres 2>&1 || true; fi
          docker rm -f -v ci-postgres >/dev/null 2>&1 || true

  # MCP tools driven through a real supabase-js client against a real
  # PostgREST.
  tool-pg:
    name: tool-pg
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TOOL_PG_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TOOL_PG_REST_URL: http://127.0.0.1:3000
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Postgres downloads and starts while the toolchain installs.
      - uses: ./.github/actions/start-postgres
      - uses: ./.github/actions/setup-core
        with:
          zero-extensions: 'false'
      - uses: ./.github/actions/tool-pg-stack
      - run: npm run test:tools
      - name: Stop PostgREST
        # Started by hand in tool-pg-stack, so nothing removes it for us. Left
        # running it keeps the name and port 3000, and the next job that
        # starts PostgREST on this runner fails.
        if: ${{ always() }}
        run: docker rm -f postgrest >/dev/null 2>&1 || true
      - name: Stop Postgres
        # Started by hand (start-postgres), so nothing else removes it. When an
        # earlier step failed, its log goes to the job log first.
        if: ${{ always() }}
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then docker logs --tail 200 ci-postgres 2>&1 || true; fi
          docker rm -f -v ci-postgres >/dev/null 2>&1 || true

  core-build:
    name: Core Build
    if: always()
    needs: [checks, pr-privacy, build, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert every core job succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          PRIVACY: ${{ needs.pr-privacy.result }}
          EVENT: ${{ github.event_name }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit-tests.result }}
        run: |
          set -euo pipefail
          echo "event=$EVENT checks=$CHECKS pr-privacy=$PRIVACY build=$BUILD unit-tests=$UNIT"
          # pr-privacy reads a pull request and is skipped on pushes to main.
          if [ "$EVENT" != "pull_request" ] && [ "$PRIVACY" = "skipped" ]; then PRIVACY=success; fi
          for r in "$CHECKS" "$PRIVACY" "$BUILD" "$UNIT"; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more core jobs did not succeed"
              exit 1
            fi
          done

  pg-real-gate:
    name: pg-real gate
    if: always()
    needs: [pg-coverage-gate, pg-real, pg-upgrade, tool-pg]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert every pg job succeeded
        env:
          EVENT: ${{ github.event_name }}
          COVERAGE: ${{ needs.pg-coverage-gate.result }}
          REAL: ${{ needs.pg-real.result }}
          UPGRADE: ${{ needs.pg-upgrade.result }}
          TOOLS: ${{ needs.tool-pg.result }}
        run: |
          set -euo pipefail
          echo "event=$EVENT pg-coverage-gate=$COVERAGE pg-real=$REAL pg-upgrade=$UPGRADE tool-pg=$TOOLS"
          # pg-coverage-gate and pg-upgrade diff a pull request against its
          # base and are skipped on pushes to main; nothing else may be.
          if [ "$EVENT" != "pull_request" ]; then
            if [ "$COVERAGE" = "skipped" ]; then COVERAGE=success; fi
            if [ "$UPGRADE" = "skipped" ]; then UPGRADE=success; fi
          fi
          for r in "$COVERAGE" "$REAL" "$UPGRADE" "$TOOLS"; do
            if [ "$r" != "success" ]; then
              echo "::error::One or more pg jobs did not succeed"
              exit 1
            fi
          done
