name: Provider names

# Names on a maintainer-held denylist (the PROVIDER_NAME_DENYLIST secret)
# must not appear in a public change or its PR text (title, body, branch
# name, commit messages), which check:guards cannot see.
# scripts/checks/provider-name-denylist.mjs reads the guarded names from the
# PROVIDER_NAME_DENYLIST secret, so neither this workflow nor the script nor
# its log lines name anything (and no digest a guess could be checked
# against is published). With an empty or missing list the job warns and
# passes: no name is guarded then, and a fork's pull request never gets the secret.
#
# Runs on the PR head with a read-only token. The PR text reaches the script
# through env, never through ${{ }} in the shell body: expression substitution
# happens before bash parses the script, so a title with shell metacharacters
# would otherwise be a code-execution sink.
#
# Trust boundary of the secret: fork PRs never receive it. Same-repository
# PRs do, as they receive every repository secret: anyone who can push a
# branch here can reference any secret from a workflow of their own, so
# running this scan from the base branch would not keep the value from them.
# Branch pushers are the maintainers, who know the names anyway. If that ever
# changes, move the secret into an environment restricted to main and the
# scan into a workflow_run stage that checks out only the base repository.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: provider-names-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Provider names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the merge base with the PR base branch exists.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
      - name: Scan the change, the PR text and the commit messages
        # Node built-ins only: no npm ci, nothing from the PR's dependencies runs.
        env:
          PROVIDER_NAME_DENYLIST: ${{ secrets.PROVIDER_NAME_DENYLIST }}
          BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.head_ref }}
        run: node scripts/checks/provider-name-denylist.mjs --base "origin/$BASE_REF" --pr-text
