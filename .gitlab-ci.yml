# GitLab CI for the ledger, run on the group's own runners (two registrations
# on one Hetzner host, up to ten jobs at a time as measured 2026-10-28). It
# took over the gates of the GitHub workflows core-build.yml and
# test-pg-real.yml when the repository moved to GitLab (2026-10-05); those
# workflows are gone.
#
# Jobs run without stage ordering (needs: []), so they run in parallel.
# A merge request can only merge when every job here is green (project
# setting "Pipelines must succeed").

workflow:
  # A new commit cancels only the interruptible jobs of the ref's older
  # pipelines. The default (conservative) also cancelled a migrations-production
  # still waiting for the runner, so on a busy day each merge cancelled the last
  # one and prod's schema lagged live code by hours (2026-10-28).
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # The report benchmark (perf-reports below): its schedule, and a run by
    # hand from Run pipeline in the web UI. No other job runs in either.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PERF_REPORTS == "1"
    # The simulated company (sim-company below): its own schedule.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^Simulated company/
    - if: $CI_PIPELINE_SOURCE == "web"
    # A branch with an open merge request already gets the MR pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: node:20-bookworm
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"

stages:
  - checks
  - test
  - pg

# Checks run on merge requests only: with squash merges onto a straight
# history, main receives exactly the tree its merge request already tested.
# main runs the production jobs and the checks cache warm-up only.
.mr-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# npm's download cache, kept on the runner between pipelines and keyed on the
# lockfile.
.npm-cache: &npm-cache
  key:
    prefix: npm-node20
    files: [package-lock.json]
  paths: [.npm/]

.npm:
  cache:
    - *npm-cache

# tsc's incremental state and ESLint's result cache, fetched from the latest
# successful main pipeline's checks-cache artifacts. They used to live in the
# runner cache, but that cache is local to one runner registration and one
# concurrency slot (ten of them on one host), and main's writer was cancelled
# by the next merge 54 times out of 70: on 2026-10-28, 107 of 183 checks jobs
# found no state in their slot and most of the rest found one hours and dozens
# of merges old, so tsc ran cold (11 GB, the job SIGKILLed half the time).
# State written for another lockfile is dropped, so a TypeScript, ESLint or
# plugin upgrade starts clean. Missing state is not an error: tsc runs cold.
.fetch-checks-state: &fetch-checks-state |
  mkdir -p "$CHECKS_CACHE_DIR"
  src="$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_DEFAULT_BRANCH/raw/$CHECKS_CACHE_DIR"
  if curl -fsSL -H "JOB-TOKEN: $CI_JOB_TOKEN" -o /tmp/state-lockfile "$src/lockfile.sha256?job=checks-cache" \
    && sha256sum -c --status /tmp/state-lockfile \
    && curl -fsSL -H "JOB-TOKEN: $CI_JOB_TOKEN" -o "$CHECKS_CACHE_DIR/tsc.tsbuildinfo" "$src/tsc.tsbuildinfo?job=checks-cache" \
    && curl -fsSL -H "JOB-TOKEN: $CI_JOB_TOKEN" -o "$CHECKS_CACHE_DIR/eslint" "$src/eslint?job=checks-cache"; then
    echo "Using main's tsc and ESLint state."
  else
    rm -f "$CHECKS_CACHE_DIR/tsc.tsbuildinfo" "$CHECKS_CACHE_DIR/eslint"
    echo "No usable state from main's checks-cache; tsc and ESLint run cold."
  fi

# The prologue every core job needs: dependencies
# and a zero-extension registry, because CI builds core with no extensions.
.setup-core:
  extends: .npm
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false
    - echo '{"extensions":[]}' > extensions.config.json
    - npm run setup:extensions

# Postgres with the Supabase auth schema.
.pg:
  extends: .npm
  services:
    - name: supabase/postgres:15.8.1.060
      alias: postgres
      variables:
        POSTGRES_PASSWORD: postgres
  variables:
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    PGPASSWORD: postgres
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    # The image initialises and restarts once; wait until it answers twice.
    - |
      for i in $(seq 1 90); do
        if psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1; then
          sleep 3
          psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1 && break
        fi
        sleep 2
      done
      psql "$DATABASE_URL" -tAc 'select version()'

checks:
  stage: checks
  extends: [.setup-core, .mr-only]
  needs: []
  # Reads main's tsc and ESLint state, so a warm tsc rechecks only what this
  # merge request changed (and still reports every stored error). It does not
  # write it back: when every merge request wrote it, each job started from
  # whatever unrelated branch saved last, and tsc took 4 to 13 minutes.
  variables:
    CHECKS_CACHE_DIR: .ci-cache
  script:
    - *fetch-checks-state
    - npm run skills:check
    - npm run taxonomy:check
    - npm run apiskill:check
    - npm run notice:check
    # ESLint's result cache sits beside tsc's state. Keyed on content, not
    # mtime: a checkout rewrites every mtime.
    - npm run check:lint -- --cache --cache-location "$CHECKS_CACHE_DIR/eslint" --cache-strategy content
    # The route types next build generates (.next/types, validator.ts). With
    # them this tsc checks a superset of what the build's own type check
    # covers, so the build job skips that pass (SKIP_BUILD_TYPECHECK).
    - npx next typegen
    - npm run check:types
    - npm run check:guards
    - npm run validate:packs
    - npm run validate:registry
    - |
      VIOLATIONS=$(grep -r "from '@/extensions/" src/lib/ src/app/api/ src/components/ --include="*.ts" --include="*.tsx" \
        | grep -v "app/api/extensions/" \
        | grep -v "components/extensions/" \
        | grep -v "lib/extensions/_generated/" \
        | grep -v "lib/extensions/loader.ts" || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "ERROR: Core code imports from @/extensions/:"
        echo "$VIOLATIONS"
        exit 1
      fi

# Writes the tsc and ESLint state every merge request's checks job reads. Each
# merge to main starts from the previous main's state, so it rechecks only what
# that merge changed. It gates nothing: a failure leaves the state one merge
# older, and the job shows as a warning (a failure elsewhere in a main pipeline
# makes the fetch fall back to an older successful pipeline's state). Not
# interruptible: when the next merge cancelled it, main's state fell hours
# behind on busy days, and a state 30 merges old costs tsc as much as none.
# Runs in every main pipeline, the nightly perf schedule and web runs too: the
# artifacts API reads only the latest successful pipeline on main, so a green
# pipeline without this job made every fetch a 404 until the next merge.
checks-cache:
  stage: checks
  extends: .setup-core
  needs: []
  allow_failure: true
  interruptible: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    CHECKS_CACHE_DIR: .ci-cache
  script:
    - *fetch-checks-state
    # Which lockfile this state belongs to; written first, so it also labels
    # what a failed run still uploads.
    - sha256sum package-lock.json > "$CHECKS_CACHE_DIR/lockfile.sha256"
    - npx next typegen
    - npm run check:types
    - npm run check:lint -- --cache --cache-location "$CHECKS_CACHE_DIR/eslint" --cache-strategy content
  artifacts:
    when: always
    paths: [.ci-cache/]
    expire_in: 7 days

build:
  stage: test
  extends: [.setup-core, .mr-only]
  needs: []
  variables:
    # The Next.js build worker OOMs on Node's default heap since 2026-08-19
    # (bundle growth); the runner has 16 GB plus swap.
    NODE_OPTIONS: --max-old-space-size=8192
    # The checks job's tsc already covers this build's type check (see there);
    # running it again here cost 5.7 minutes per pipeline. Vercel builds leave
    # it unset and still type-check.
    SKIP_BUILD_TYPECHECK: "1"
  script:
    - npm run build

unit-tests:
  stage: test
  extends: [.setup-core, .mr-only]
  needs: []
  parallel: 4
  script:
    - npm test -- --shard="${CI_NODE_INDEX}/${CI_NODE_TOTAL}"

# A migration that touches a trigger, RPC, RLS policy or DEFERRABLE constraint
# must come with a *.pg.test.ts (scripts/check-pg-test-coverage.mjs).
pg-coverage-gate:
  stage: checks
  needs: []
  variables:
    GIT_DEPTH: "0"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - PG_GATE_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA" node scripts/check-pg-test-coverage.mjs

# Every migration replayed on an empty database, then the pg-real suite.
pg-real:
  stage: pg
  extends: [.pg, .mr-only]
  needs: []
  script:
    - npm ci --prefer-offline --no-audit --fund=false
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
    - |
      set -euo pipefail
      for f in supabase/migrations/*.sql; do
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null || { echo "Failed applying $f"; exit 1; }
      done
    - npm run test:pg

# Schema at the merge base, real rows seeded, then ONLY the new migrations on
# top: proves existing data survives them.
pg-upgrade:
  stage: pg
  extends: .pg
  needs: []
  variables:
    GIT_DEPTH: "0"
  # Only a merge request that adds a migration, or changes what the upgrade
  # replays and seeds, has anything to upgrade-test; the rest no longer start
  # a Postgres container just to find that out.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - supabase/migrations/**/*
        - supabase/bootstrap.sql
        - tests/pg/bootstrap.sql
        - tests/pg/upgrade/**/*
  script:
    - |
      set -euo pipefail
      BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      echo "Merge base: $BASE"
      git ls-tree -r --name-only HEAD -- supabase/migrations | grep '\.sql$' | sort > /tmp/head-migrations.txt
      git ls-tree -r --name-only "$BASE" -- supabase/migrations | grep '\.sql$' | sort > /tmp/base-migrations.txt
      comm -23 /tmp/head-migrations.txt /tmp/base-migrations.txt > /tmp/new-migrations.txt
      COUNT=$(wc -l < /tmp/new-migrations.txt | tr -d ' ')
      echo "New migrations ($COUNT):"
      cat /tmp/new-migrations.txt
      if [ "$COUNT" = "0" ]; then echo "This merge request adds no migration; nothing to upgrade-test."; exit 0; fi
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
      while read -r f; do
        git show "$BASE:$f" | psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q >/dev/null || { echo "Failed applying (base) $f"; exit 1; }
      done < /tmp/base-migrations.txt
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/upgrade/seed.sql
      while read -r f; do
        echo "Applying (new) $f"
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null
      done < /tmp/new-migrations.txt
      psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/pg/upgrade/assert.sql

# Postgres and PostgREST with every migration replayed, for the jobs that drive
# the product through a real supabase-js client. Services share one network per
# job (FF_NETWORK_PER_BUILD) so PostgREST can reach Postgres by its alias.
.tool-pg-stack:
  stage: pg
  extends: .npm
  needs: []
  variables:
    FF_NETWORK_PER_BUILD: "true"
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    TOOL_PG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    TOOL_PG_REST_URL: http://postgrest:3000
    PGPASSWORD: postgres
  services:
    - name: supabase/postgres:15.8.1.060
      alias: postgres
      variables:
        POSTGRES_PASSWORD: postgres
    - name: postgrest/postgrest:v12.2.3
      alias: postgrest
      variables:
        PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
        PGRST_DB_SCHEMAS: public
        PGRST_DB_ANON_ROLE: anon
        PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
        PGRST_DB_MAX_ROWS: "100000"
        PGRST_SERVER_PORT: "3000"
  before_script:
    - npm ci --prefer-offline --no-audit --fund=false
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    - |
      for i in $(seq 1 90); do
        if psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1; then
          sleep 3
          psql "$DATABASE_URL" -tAc 'select 1' >/dev/null 2>&1 && break
        fi
        sleep 2
      done
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql
    # Same replay as pg-real, and no bulk GRANT after it: the database then
    # carries the grants production has, so a tool that needs a grant prod
    # lacks fails here with 42501 instead of in production.
    - psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/bootstrap.sql
    - |
      set -euo pipefail
      for f in supabase/migrations/*.sql; do
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null || { echo "Failed applying $f"; exit 1; }
      done
    # PostgREST started before the schema existed: make it reload, then wait.
    - psql "$DATABASE_URL" -q -c "NOTIFY pgrst, 'reload schema'"
    - |
      for i in $(seq 1 60); do
        curl -sf -o /dev/null "$TOOL_PG_REST_URL/" && break
        sleep 1
      done
      curl -sf -o /dev/null "$TOOL_PG_REST_URL/"

# MCP tools driven through a real supabase-js client against a real PostgREST.
tool-pg:
  extends: [.tool-pg-stack, .mr-only]
  script:
    - npm run test:tools

# The simulated company (tests/sim): three years of a company built through the
# MCP tools, then moms, AGI, INK2 and the årsredovisning judged against an
# answer key worked out from the same events. Too long for every merge request,
# so it has its own nightly schedule, told apart by its description because the
# project allows no pipeline variables, a manual job in a pipeline started from
# Run pipeline, and a run on any merge request that changes the company itself.
sim-company:
  extends: .tool-pg-stack
  timeout: 60m
  # A run takes about 25 minutes and is no older version of anything: as
  # interruptible, the next merge to main cancelled the night's run.
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^Simulated company/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - tests/sim/**/*
        - scripts/sim/**/*
  script:
    - SIM_SCALE=full npm run sim:build
    - npm run test:sim
  artifacts:
    when: always
    paths: [.local/sim/]
    expire_in: 14 days

# The report benchmark (scripts/perf/README.md, "Report benchmark"): every
# migration replayed into Postgres 17 with prod's shared_buffers and work_mem,
# a synthetic company the size of the largest in production seeded, then
# every report RPC and the posting path timed warm and under mixed load. Fails
# when a p95 is over its budget in scripts/perf/bench/budgets.json. Runs in a
# scheduled pipeline when PERF_REPORTS is 1, and as a manual job in a pipeline
# started from Run pipeline; never in merge request or main pipelines. The
# project allows no pipeline variables (minimum role no_one_allowed), so a
# schedule cannot carry PERF_REPORTS itself: it is a project CI/CD variable,
# and deleting it pauses the schedule's benchmark. About 9 minutes on the
# shared runner, so it stays interruptible.
perf-reports:
  stage: pg
  extends: .npm
  needs: []
  interruptible: true
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PERF_REPORTS == "1" && $CI_PIPELINE_SCHEDULE_DESCRIPTION !~ /^Simulated company/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  services:
    - name: supabase/postgres:17.6.1.136
      alias: postgres
      # Prod's settings (Supabase Large: shared_buffers, work_mem,
      # max_connections); the image ships 128MB for both caches.
      # effective_cache_size assumes three quarters of the compute's 8 GB.
      # Dynamic shared memory in files: a service container's /dev/shm is
      # 64 MB, which parallel queries outgrow under load.
      command: ["postgres", "-D", "/etc/postgresql", "-c", "shared_buffers=2GB", "-c", "work_mem=12MB",
                "-c", "max_connections=160", "-c", "effective_cache_size=6GB",
                "-c", "dynamic_shared_memory_type=mmap"]
      variables:
        POSTGRES_PASSWORD: postgres
  variables:
    PGHOST: postgres
    PGPASSWORD: postgres
    BENCH_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    - npm ci --prefer-offline --no-audit --fund=false
    - sh scripts/perf/bench/setup-db.sh
    # Both modes run even when the first is over budget, so one run shows both.
    - |
      status=0
      npx tsx scripts/perf/bench/run.ts --mode warm --check --out perf-warm.json || status=1
      npx tsx scripts/perf/bench/run.ts --mode mixed --check --out perf-mixed.json || status=1
      exit $status
  artifacts:
    when: always
    paths: [perf-warm.json, perf-mixed.json]
    expire_in: 90 days

# Production migrations on every merge to main, as Supabase's GitHub
# integration did (it applied out-of-order versions too, hence --include-all).
# Runs on push to main only, one at a time, and lists what is applied before
# and after so the log shows exactly what changed.
#
# No `supabase link`: that reads the project's API keys, which this job has no
# use for. The token only looks up the session pooler's address; the CLI then
# connects with the database password. The URL holds the password and is never
# printed. Secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD, protected
# and masked.
migrations-production:
  stage: checks
  needs: []
  interruptible: false
  resource_group: production-database
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    SUPABASE_PROJECT_REF: pwxtzglxptnnvjrpixpg
    SUPABASE_CLI: supabase@2.119.0
  script:
    - test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is not set for main"; exit 1; }
    - test -n "$SUPABASE_DB_PASSWORD" || { echo "SUPABASE_DB_PASSWORD is not set for main"; exit 1; }
    - |
      set -euo pipefail
      # An older merge's job hands over to the job of main's head, which is no
      # longer cancelled and pushes every migration main has; pushing an older
      # tree after a newer one fails on the versions it does not have.
      head=$(git ls-remote origin refs/heads/main | cut -f1) || head=""
      if [ -n "$head" ] && [ "$head" != "$CI_COMMIT_SHA" ]; then
        echo "main is at $head; its pipeline applies the migrations"
        exit 0
      fi
      curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
        "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" > /tmp/pooler.json
      node -e '
        const list = [].concat(JSON.parse(require("fs").readFileSync("/tmp/pooler.json", "utf8")));
        const p = list.find((x) => x.database_type === "PRIMARY") || list[0];
        if (!p || !p.db_host || !p.db_user) { console.error("No pooler config for the primary database"); process.exit(1) }
        console.log("Session pooler: " + p.db_host + ":5432 as " + p.db_user);
        const pw = encodeURIComponent(process.env.SUPABASE_DB_PASSWORD);
        require("fs").writeFileSync("/tmp/db-url", `postgresql://${p.db_user}:${pw}@${p.db_host}:5432/${p.db_name || "postgres"}?sslmode=require`);
      '
      export SUPABASE_DB_URL="$(cat /tmp/db-url)"
      rm -f /tmp/db-url
      npx -y "$SUPABASE_CLI" migration list --db-url "$SUPABASE_DB_URL" | tail -15
      npx -y "$SUPABASE_CLI" db push --include-all --db-url "$SUPABASE_DB_URL"
      npx -y "$SUPABASE_CLI" migration list --db-url "$SUPABASE_DB_URL" | tail -8
